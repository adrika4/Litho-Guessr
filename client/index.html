<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoGuessr Clone</title>
  </head>
  <body>
    <div id="photo-box">
      <div id="mly"></div>
      <div id="status">
        <span id="status-text"></span>
        <button id="retry-btn" hidden>Try again</button>
      </div>
    </div>
    <div id="map"></div>

    <div id="hud">
      <span id="round-label"></span>
      <span id="total-label"></span>
    </div>

    <div id="panel">
      <button id="guess-btn" disabled>Guess</button>
      <button id="next-btn" hidden>Next round</button>
      <p id="result"></p>
    </div>

    <div id="final" hidden>
      <div id="final-card">
        <h2>Game over</h2>
        <p id="final-total"></p>
        <ol id="final-list"></ol>
        <div id="submit-box">
          <input id="name-input" maxlength="20" placeholder="Your name" />
          <button id="submit-btn">Save score</button>
        </div>
        <p id="submit-msg"></p>
        <h3>Top 10</h3>
        <ol id="leaderboard"></ol>
        <button id="play-again-btn">Play again</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
